<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>力学的ブロック崩し</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap">
<style>
:root{--paper:#ece9e2;--ink:#34363a;--grid:#cbc7bb;--acc:#b3402a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1f2023;--ink:#d8d6cf;--grid:#37383c;--acc:#ff8a65}}
:root[data-theme="dark"]{--paper:#1f2023;--ink:#d8d6cf;--grid:#37383c;--acc:#ff8a65}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:10px 12px 24px}
h1{font-size:22px;margin:4px 0 6px;font-weight:400}
canvas{width:100%;height:auto;display:block;touch-action:none}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row label{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-size:15px}
input[type=range]{flex:1;accent-color:var(--acc)}
button{font:inherit;font-size:15px;color:var(--ink);background:none;border:1.5px solid var(--ink);border-radius:3px;padding:5px 11px}
button.go,button.on{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.info{font-size:14px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.info span:nth-child(odd){white-space:nowrap}
#msg{min-height:1.6em;color:var(--acc);font-size:17px}
#fx{min-height:1.4em;font-size:14px}
#next,#regen{display:none}
.help{font-size:13px;opacity:.8;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>力学的ブロック崩し</h1>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="fx"></div>
<div class="info" id="info"></div>
<div class="row" id="balls"></div>
<div class="row"><label>角度θ <input id="sa" type="range" min="-180" max="180" step="1" value="60"><b id="av" style="min-width:3.5em"></b></label></div>
<div class="row">
<button class="go" id="fire">発射</button>
<button id="stop">止める</button>
<button id="fast">倍速 ×1</button>
<button id="reset">最初から</button>
<button class="go" id="next">次へ</button>
<button id="regen">フィールドを更新</button>
</div>
<div class="help">盤面タップで発射位置、ドラッグで角度。初速は 2.5g 固定。球が止まったら「止める」で1発を終わらせます。壁の線が太いほど反発係数が大きく、点線の床は「なし」(落ちると球が消える)です。</div>
</main>
<script>
const g=9.8,R=1,ML=38,MT=10,MB=30,MR=10,FW=557,CW=ML+FW+MR,CH=MT+FW+MB,DT=1/480,V0=2.5*g,VMAX=300;
const BALLS=[{n:'スーパー e1·m',e:1,M:1,col:'#c0392b'},{n:'鉄球 e.75·2m',e:.75,M:2,col:'#7f8c8d'},{n:'ド○ゴンボール e.75·m',e:.75,M:1,col:'#e67e22'}];
const TOAST=['反発係数2のブロックが出現!','球が真二つに分離!','質量×2(30秒)','重力×2(30秒)','無重力(30秒)','ドパガキモード突入(30秒)'];
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=CW*dpr;cv.height=CH*dpr;
let N,W,H,S,wl,L=1,seed=1,blocks=[],balls=[],trail=[],shots=0,lim=2,lvT=0,totT=0,totS=0,sumS=0,sumL=0,state='aim',ballType=0,dUses=0,aim={x:0,y:0},mult=1,stillT=0,failStreak=0,fx={},toast='',toastAt=0,lastGrade='-',cols,rows;
const tx=x=>ML+x*S,ty=y=>MT+(H-y)*S;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gradeOf=r=>r<=.5?'S':r<=.6?'A':r<=.7?'B':r<=.8?'C':r<=.9?'D':r<1?'E':'F';
function setup(){
  N=6+Math.floor((L-1)/2);W=H=N*g;S=FW/W;
  const r=mulberry(seed+L*7919),pick=a=>a[Math.floor(r()*a.length)],es=[1,1,.9,.75,.5,.25];
  wl=L===1?{l:1,r:1,c:1,f:1}:{l:pick(es),r:pick(es),c:pick(es),f:(L>=3&&r()<.2)?0:pick(es)};
  cols=Math.floor(N/2);rows=Math.min(2+Math.floor(L/4),N-4);
  const cw=W/cols,cells=[];
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)cells.push([i,j]);
  for(let k=cells.length-1;k>0;k--){const m=Math.floor(r()*(k+1));[cells[k],cells[m]]=[cells[m],cells[k]]}
  const cnt=Math.min(cells.length,Math.round(cols*rows*Math.max(.4,1-.03*L)));
  blocks=cells.slice(0,cnt).map(([i,j])=>{const hat=L>=2&&r()<.12,e=hat?1:(r()<.5?1:.5);
    return{x:i*cw,y:j*g,w:cw,h:g,i,j,e,hat,th:(e===1?16:8)*g,imp:0,alive:true}});
  lim=3+Math.floor(L*.4);shots=0;lvT=0;balls=[];trail=[];fx={mass:0,grav:0,zero:0,dopa:0};
  aim={x:W/2,y:(rows+2)*g};state='aim';stillT=0;
  if(ballType===2&&L<43)ballType=0;
  $('msg').textContent='';$('next').style.display='none';$('regen').style.display='none';buildBalls();syncUI();
}
function buildBalls(){
  const box=$('balls');box.innerHTML='';
  BALLS.forEach((b,i)=>{if(i===2&&L<43)return;const bt=document.createElement('button');
    bt.textContent=b.n;if(i===ballType)bt.className='on';
    bt.onclick=()=>{ballType=i;buildBalls();syncUI()};box.appendChild(bt)});
}
const gk=()=>(fx.zero>0?0:fx.grav>0?2:1);
const mk=()=>(fx.mass>0?2:1)*(fx.dopa>0?2:1);
function insideBlock(x,y){return blocks.some(b=>b.alive&&Math.hypot(x-Math.max(b.x,Math.min(x,b.x+b.w)),y-Math.max(b.y,Math.min(y,b.y+b.h)))<R+.05)}
function step(b,dt,commit,pend){
  const sp=Math.hypot(b.vx,b.vy);if(sp>VMAX){b.vx*=VMAX/sp;b.vy*=VMAX/sp}
  const gg=g*gk();b.x+=b.vx*dt;b.y+=b.vy*dt-.5*gg*dt*dt;b.vy-=gg*dt;
  const eb=fx.dopa>0?1.5:b.e;
  if(b.x<R){if(b.vx<0){const E=eb*wl.l;b.x=R+(R-b.x)*E;b.vx*=-E}else b.x=R}
  if(b.x>W-R){if(b.vx>0){const E=eb*wl.r;b.x=W-R-(b.x-W+R)*E;b.vx*=-E}else b.x=W-R}
  if(b.y>H-R){if(b.vy>0){const E=eb*wl.c;b.y=H-R-(b.y-H+R)*E;b.vy*=-E}else b.y=H-R}
  if(wl.f>0){if(b.y<R){if(b.vy<0){const E=eb*wl.f;b.y=R+(R-b.y)*E;b.vy*=-E}else b.y=R}}else if(b.y<-5)b.lost=true;
  if(!isFinite(b.x+b.y+b.vx+b.vy)){b.lost=true;return}
  b.x=Math.min(W-R,Math.max(R,b.x));b.y=Math.min(H-R,b.y);if(wl.f>0)b.y=Math.max(R,b.y);
  for(const k of blocks){
    if(!k.alive||b.x<k.x-R||b.x>k.x+k.w+R||b.y<k.y-R||b.y>k.y+k.h+R)continue;
    const cx=Math.max(k.x,Math.min(b.x,k.x+k.w)),cy=Math.max(k.y,Math.min(b.y,k.y+k.h));
    const dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
    if(d2>=R*R)continue;
    let nx,ny,pen=0;
    if(d2<1e-9){
      const l=b.x-k.x,r=k.x+k.w-b.x,bt=b.y-k.y,tp=k.y+k.h-b.y,m=Math.min(l,r,bt,tp);
      if(m===l){nx=-1;ny=0;b.x=k.x-R}else if(m===r){nx=1;ny=0;b.x=k.x+k.w+R}
      else if(m===bt){nx=0;ny=-1;b.y=k.y-R}else{nx=0;ny=1;b.y=k.y+k.h+R}
    }else{const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=R-d;b.x=cx+nx*R;b.y=cy+ny*R}
    const vn=-(b.vx*nx+b.vy*ny);
    if(vn>0){
      const E=eb*k.e,j=(1+E)*vn;if(pen>0){b.x+=nx*pen*E;b.y+=ny*pen*E}
      b.vx+=j*nx;b.vy+=j*ny;
      if(commit&&j>.05){k.imp+=b.M*mk()*j;if(k.imp>=k.th){k.alive=false;if(k.hat)pend.push([b,k])}}
    }
  }
}
function collideBalls(){
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
    if(d2>=4*R*R||d2<1e-12)continue;
    const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,vr=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    if(vr<=0)continue;
    const jj=2*vr/(1/a.M+1/b.M);
    a.vx-=jj/a.M*nx;a.vy-=jj/a.M*ny;b.vx+=jj/b.M*nx;b.vy+=jj/b.M*ny;
    const ov=(2*R-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  }
}
function startDopa(){if(fx.dopa<=0)for(const b of balls){b.vx*=2;b.vy*=2}fx.dopa=30}
function tickFx(dt){
  for(const k of['mass','grav','zero'])if(fx[k]>0)fx[k]=Math.max(0,fx[k]-dt);
  if(fx.dopa>0){fx.dopa-=dt;if(fx.dopa<=0){fx.dopa=0;for(const b of balls){b.vx/=2;b.vy/=2}}}
}
function hatena(b){
  const r=Math.floor(Math.random()*6);
  toast=TOAST[r];toastAt=performance.now();
  if(r===0){
    const cw=W/cols,free=[];
    for(let i=0;i<cols;i++)for(let j=0;j<rows+3;j++){
      if(blocks.some(k=>k.alive&&k.i===i&&k.j===j))continue;
      const x=i*cw,y=j*g;
      if(balls.some(o=>Math.hypot(o.x-Math.max(x,Math.min(o.x,x+cw)),o.y-Math.max(y,Math.min(o.y,y+g)))<R+.5))continue;
      free.push([i,j]);
    }
    if(free.length){const[i,j]=free[Math.floor(Math.random()*free.length)];
      blocks.push({x:i*cw,y:j*g,w:cw,h:g,i,j,e:2,hat:false,th:16*g,imp:0,alive:true})}
  }else if(r===1){
    const ux=-b.vy*.4,uy=b.vx*.4,b2={...b};
    b.M/=2;b2.M=b.M;b.vx+=ux;b.vy+=uy;b2.vx-=ux;b2.vy-=uy;balls.push(b2);
  }else if(r===2)fx.mass=30;
  else if(r===3)fx.grav=30;
  else if(r===4)fx.zero=30;
  else startDopa();
}
function launchAngle(){return+$('sa').value*Math.PI/180}
function fire(){
  if(state!=='aim'||insideBlock(aim.x,aim.y))return;
  const T=BALLS[ballType],a=launchAngle();
  shots++;totS++;trail=[];stillT=0;fx={mass:0,grav:0,zero:0,dopa:0};
  balls=[{x:aim.x,y:aim.y,vx:V0*Math.cos(a),vy:V0*Math.sin(a),e:T.e,M:T.M,col:T.col}];
  state='fly';$('msg').textContent='';
  if(ballType===2){dUses++;if(dUses>=7){dUses=0;startDopa();toast=TOAST[5];toastAt=performance.now()}}
  syncUI();
}
function endShot(why){
  balls=[];fx={mass:0,grav:0,zero:0,dopa:0};acc=0;
  const cleared=blocks.every(k=>!k.alive);
  if(cleared)finish(true);
  else if(shots>=lim)finish(false);
  else{state='aim';$('msg').textContent={lost:'球が落ちました',still:'球が止まりました'}[why]||''}
  syncUI();
}
function finish(ok){
  sumS+=shots;sumL+=lim;failStreak=ok?0:failStreak+1;
  lastGrade=ok?gradeOf(shots/lim):'F';
  const cum=gradeOf(sumS/sumL);
  if(ok){
    state=L>=99?'all':'clear';
    $('msg').textContent=(L>=99?'ALL CLEAR! ':'')+'Lv'+L+'クリア! '+shots+'/'+lim+'手 '+lvT.toFixed(1)+'秒 スコア'+lastGrade+' / 通算'+cum;
    $('next').textContent=L>=99?'最初から':'次のレベルへ';
  }else{
    state='fail';
    $('msg').textContent='手数切れ… Lv'+L+'をやり直し (スコアF / 通算'+cum+')';
    $('next').textContent='やり直す';
  }
  $('next').style.display='inline-block';$('regen').style.display=failStreak>=5?'inline-block':'none';
}
let last=performance.now(),acc=0,tr=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='fly'){
    acc+=dt*mult;
    while(acc>=DT&&state==='fly'){
      const pend=[];
      for(const b of balls)step(b,DT,true,pend);collideBalls();
      for(const[b]of pend)hatena(b);
      balls=balls.filter(b=>!b.lost);
      tickFx(DT);lvT+=DT;totT+=DT;acc-=DT;tr+=DT;
      if(tr>.03){tr=0;for(const b of balls)trail.push([b.x,b.y,b.col]);if(trail.length>240)trail.splice(0,trail.length-240)}
      
      if(blocks.every(k=>!k.alive)){endShot('clear');break}
      if(!balls.length){endShot('lost');break}
      
    }
    syncUI();
  }
  draw();requestAnimationFrame(loop);
}
function preview(){
  const T=BALLS[ballType],a=launchAngle(),b={x:aim.x,y:aim.y,vx:V0*Math.cos(a),vy:V0*Math.sin(a),e:T.e,M:T.M},pts=[];
  for(let i=0;i<900&&!b.lost;i++){step(b,DT*2,false,[]);if(i%12===0)pts.push([b.x,b.y])}
  return pts;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const paper=css('--paper'),ink=css('--ink'),grid=css('--grid'),acc=css('--acc');
  ctx.fillStyle=paper;ctx.fillRect(0,0,CW,CH);
  ctx.font='12px "Zen Kurenaido",sans-serif';ctx.textBaseline='middle';
  const stp=Math.max(1,Math.ceil(N/6));
  ctx.lineWidth=1;ctx.strokeStyle=grid;
  for(let k=0;k<=N;k+=stp){
    ctx.beginPath();ctx.moveTo(tx(k*g),ty(0));ctx.lineTo(tx(k*g),ty(H));ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx(0),ty(k*g));ctx.lineTo(tx(W),ty(k*g));ctx.stroke();
  }
  ctx.fillStyle=ink;
  for(let k=stp;k<=N;k+=stp){ctx.textAlign='right';ctx.fillText(k+'g',ML-4,ty(k*g));ctx.textAlign='center';ctx.fillText(k+'g',tx(k*g),ty(0)+13)}
  ctx.strokeStyle=ink;ctx.lineCap='butt';
  const seg=(x1,y1,x2,y2,e,dash)=>{ctx.lineWidth=1+3*e;ctx.setLineDash(dash?[6,5]:[]);ctx.beginPath();ctx.moveTo(tx(x1),ty(y1));ctx.lineTo(tx(x2),ty(y2));ctx.stroke();ctx.setLineDash([])};
  seg(0,0,0,H,wl.l);seg(W,0,W,H,wl.r);seg(0,H,W,H,wl.c);
  if(wl.f>0)seg(0,0,W,0,wl.f);else seg(0,0,W,0,.3,true);
  for(const b of blocks){
    if(!b.alive)continue;
    const rem=Math.max(0,1-b.imp/b.th),x=tx(b.x),y=ty(b.y+b.h),w=b.w*S,h=b.h*S;
    if(w<24){ctx.globalAlpha=.3+.7*rem;ctx.fillStyle=b.e===2?acc:b.e===.5?grid:ink;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;ctx.strokeStyle=paper;ctx.lineWidth=.8;ctx.strokeRect(x,y,w,h);if(b.hat){ctx.fillStyle=acc;ctx.fillRect(x+w*.3,y+h*.3,w*.4,h*.4)}continue}
    ctx.save();ctx.globalAlpha=.3+.7*rem;ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    const dark=b.e!==.5,two=b.e===2;
    ctx.fillStyle=two?acc:dark?ink:paper;ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=dark?paper:ink;ctx.lineWidth=1.2;
    const sp=Math.max(3,Math.min(dark?6:9,w/5));
    ctx.beginPath();
    for(let k=-h;k<w+h;k+=sp){ctx.moveTo(x+k,y);ctx.lineTo(x+k+h,y+h)}
    if(dark)for(let k=-h;k<w+h;k+=sp){ctx.moveTo(x+k+h,y);ctx.lineTo(x+k,y+h)}
    ctx.stroke();ctx.restore();
    ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
    ctx.textAlign='center';
    if(b.hat||w>=60){
      const lab=b.hat?'?':'e='+b.e+' 残'+Math.round(rem*100)+'%';
      ctx.font=(b.hat?'bold '+Math.max(10,Math.min(h*.8,22)):'12')+'px "Zen Kurenaido",sans-serif';
      const tw=ctx.measureText(lab).width+(b.hat?8:10);
      ctx.fillStyle=paper;ctx.fillRect(x+w/2-tw/2,y+h/2-Math.min(9,h/2),tw,Math.min(18,h));
      ctx.fillStyle=b.hat?acc:ink;ctx.fillText(lab,x+w/2,y+h/2);ctx.font='12px "Zen Kurenaido",sans-serif';
    }
  }
  if(state==='aim'){
    ctx.fillStyle=acc;
    for(const p of preview()){ctx.beginPath();ctx.arc(tx(p[0]),ty(p[1]),1.6,0,7);ctx.fill()}
    const a=launchAngle();ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.beginPath();
    const al=Math.max(5,26/S);ctx.moveTo(tx(aim.x),ty(aim.y));ctx.lineTo(tx(aim.x+al*Math.cos(a)),ty(aim.y+al*Math.sin(a)));ctx.stroke();
  }
  ctx.globalAlpha=.45;for(const p of trail){ctx.fillStyle=p[2];ctx.beginPath();ctx.arc(tx(p[0]),ty(p[1]),1.8,0,7);ctx.fill()}ctx.globalAlpha=1;
  const rr=Math.max(R*S,4);
  const list=state==='fly'?balls:[{x:aim.x,y:aim.y,col:BALLS[ballType].col}];
  for(const b of list){ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(tx(b.x),ty(b.y),rr,0,7);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.stroke()}
  ctx.fillStyle=ink;ctx.textAlign='left';ctx.fillText('y[m]',2,MT+8);ctx.textAlign='right';ctx.fillText('x[m]',CW-2,ty(0)+13);
  if(fx.dopa>0){
    const tt=performance.now()/1000,gr=ctx.createLinearGradient(0,0,CW,CH);
    for(let i=0;i<=6;i++)gr.addColorStop(i/6,'hsl('+((i*60+tt*200)%360)+',100%,55%)');
    ctx.globalAlpha=.3;ctx.fillStyle=gr;ctx.fillRect(0,0,CW,CH);ctx.globalAlpha=1;
    ctx.font='bold '+(54+6*Math.sin(tt*14))+'px "Zen Kurenaido",sans-serif';ctx.textAlign='center';ctx.lineJoin='round';
    ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText('ドパガキモード',CW/2,CH*.2);ctx.fillStyle=gr;ctx.fillText('ドパガキモード',CW/2,CH*.2);
    ctx.font='bold 22px "Zen Kurenaido",sans-serif';ctx.lineWidth=4;const rt='残り '+fx.dopa.toFixed(1)+' 秒';
    ctx.strokeText(rt,CW/2,CH*.2+44);ctx.fillStyle='#fff';ctx.fillText(rt,CW/2,CH*.2+44);
  }
  cv.style.boxShadow=fx.dopa>0?'0 0 28px 8px hsl('+((performance.now()/5)%360)+',100%,60%)':'none';
}
function syncUI(){
  $('av').textContent=$('sa').value+'°';
  const f=[];
  if(fx.mass>0)f.push('質量×2 '+fx.mass.toFixed(1)+'s');
  if(fx.grav>0)f.push('重力×2 '+fx.grav.toFixed(1)+'s');
  if(fx.zero>0)f.push('無重力 '+fx.zero.toFixed(1)+'s');
  if(fx.dopa>0)f.push('ドパガキ '+fx.dopa.toFixed(1)+'s');
  if(performance.now()-toastAt<3500)f.unshift('★'+toast);
  
  $('fx').textContent=f.join('  ');
  const cum=sumL?gradeOf(sumS/sumL):'-';
  const w=x=>x>0?x:'なし';
  $('info').innerHTML=['Lv '+L+(L>=99?' (最終)':''),'手数 '+shots+' / '+lim,
    '今回 '+lvT.toFixed(1)+' 秒','累積 '+totS+'手 '+totT.toFixed(0)+'秒',
    'スコア '+lastGrade+' / 通算 '+cum,'ブロック残 '+blocks.filter(k=>k.alive).length,
    '壁e 左'+wl.l+' 右'+wl.r+' 天'+wl.c,'床e '+w(wl.f),
    '発射位置 ('+aim.x.toFixed(1)+', '+aim.y.toFixed(1)+')'].concat(L>=43?['ド○ゴンボール使用 '+dUses+'/7']:[]).map(s=>'<span>'+s+'</span>').join('');
  $('fire').disabled=state!=='aim'||insideBlock(aim.x,aim.y);
}
function toField(e){const r=cv.getBoundingClientRect(),k=CW/r.width;return{x:((e.clientX-r.left)*k-ML)/S,y:H-((e.clientY-r.top)*k-MT)/S}}
let dragging=false;
cv.addEventListener('pointerdown',e=>{
  if(state!=='aim')return;
  const p=toField(e);p.x=Math.max(R,Math.min(W-R,p.x));p.y=Math.max(R,Math.min(H-R,p.y));
  if(insideBlock(p.x,p.y)){$('msg').textContent='ブロックの中には置けません';return}
  $('msg').textContent='';aim=p;dragging=true;cv.setPointerCapture(e.pointerId);syncUI();
});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const p=toField(e),dx=p.x-aim.x,dy=p.y-aim.y;
  if(Math.hypot(dx,dy)>2*Math.max(1,N/6)){$('sa').value=Math.round(Math.atan2(dy,dx)*180/Math.PI);syncUI()}
});
const endDrag=()=>{dragging=false};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('sa').oninput=syncUI;$('fire').onclick=fire;
$('stop').onclick=()=>{if(state==='fly')endShot('')};
$('fast').onclick=()=>{mult=mult===1?3:mult===3?10:1;$('fast').textContent='倍速 ×'+mult};
function fullReset(){failStreak=0;L=1;seed=Math.floor(Math.random()*1e6);totT=0;totS=0;sumS=0;sumL=0;lastGrade='-';dUses=0;ballType=0;setup()}
$('reset').onclick=fullReset;
$('regen').onclick=()=>{failStreak=0;seed=Math.floor(Math.random()*1e6);setup()};
$('next').onclick=()=>{
  if(state==='clear'){L++;seed=Math.floor(Math.random()*1e6);setup()}
  else if(state==='fail')setup();
  else if(state==='all')fullReset();
};
fullReset();requestAnimationFrame(loop);
</script>
</body>
