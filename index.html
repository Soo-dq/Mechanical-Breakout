<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>力学的ブロック崩し</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap">
  <style>
    :root {
      --paper: #f4f5f7;
      --surface: #ffffff;
      --ink: #242b36;
      --muted: #647184;
      --grid: #dce1e8;
      --acc: #b3402a;
      --border: #d7dde5;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #151a22;
        --surface: #202733;
        --ink: #e7ebf2;
        --muted: #a6b0c0;
        --grid: #343d4a;
        --acc: #ff987e;
        --border: #394453;
      }
    }

    :root[data-theme="dark"] {
      --paper: #151a22;
      --surface: #202733;
      --ink: #e7ebf2;
      --muted: #a6b0c0;
      --grid: #343d4a;
      --acc: #ff987e;
      --border: #394453;
    }

    :root[data-theme="light"] {
      --paper: #f4f5f7;
      --surface: #ffffff;
      --ink: #242b36;
      --muted: #647184;
      --grid: #dce1e8;
      --acc: #b3402a;
      --border: #d7dde5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background-color: #fff;
      background-image:
        linear-gradient(rgba(230,0,18,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230,0,18,.06) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink);
      font-family: "Zen Kurenaido", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: var(--paper);
        background-image: none;
      }
    }
    :root[data-theme="dark"] body {
      background-color: var(--paper);
      background-image: none;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 16px 28px;
    }

    /* WP風 H1 装飾 */
    h1 {
      background: #111;
      color: #fff;
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 900;
      letter-spacing: 0.04em;
      display: block;
      position: relative;
      margin: 4px 0 18px;
      padding: .75em .9em .75em 1.1em;
      border-left: 8px solid #e60012;
      border-right: 20px solid #e60012;
      box-shadow: 7px 7px 0 #e60012;
      line-height: 1.35;
    }
    h1::before {
      content: "";
      position: absolute;
      left: -16px; top: 0;
      width: 8px; height: 100%;
      background: #111;
    }
    h1::after {
      content: "";
      position: absolute;
      left: 0; bottom: -6px;
      width: 35%;
      border-bottom: 3px solid #111;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      touch-action: none;
    }

    #msg {
      min-height: 1.8em;
      margin: 12px 2px 4px;
      color: var(--acc);
      font-size: 17px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    #fx {
      min-height: 1.6em;
      margin: 4px 2px 10px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin: 12px 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--border);
    }

    .info span {
      min-width: 0;
      padding: 7px 9px;
      background: var(--surface);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .row label {
      display: flex;
      flex: 1 1 100%;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-size: 15px;
      font-weight: 600;
    }

    input[type="range"] {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 32px;
      margin: 0;
      accent-color: var(--acc);
    }

    #av {
      min-width: 4em !important;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--acc);
    }

    button {
      min-height: 44px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      touch-action: manipulation;
    }

    button.go,
    button.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    button:active:not(:disabled) {
      opacity: .75;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 3px;
    }

    #balls button {
      flex: 1 1 auto;
      min-width: 0;
    }

    #fire {
      flex: 1 1 100px;
      min-height: 48px;
      font-size: 16px;
    }

    #stop {
      flex: 1 1 70px;
    }

    #fast {
      flex: 1 1 90px;
    }

    #reset,
    #next,
    #regen {
      flex: 1 1 100px;
    }

    #next,
    #regen {
      display: none;
    }

    .help {
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 8px 2px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend span {
      white-space: nowrap;
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
    }

    @media (max-width: 420px) {
      main {
        padding: 10px 10px 24px;
      }

      h1 {
        font-size: 22px;
      }

      .row {
        gap: 6px;
        padding: 8px;
      }

      button {
        padding: 9px 10px;
        font-size: 13px;
      }

      .info {
        padding: 5px;
      }

      .info span {
        padding: 7px 6px;
        font-size: 12px;
      }

      #balls button {
        flex-basis: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>力学的ブロック崩し</h1>
    <canvas id="c"></canvas>

    <div id="msg"></div>
    <div id="fx"></div>

    <div class="legend">
      <span><i style="background:#27ae60"></i>合成ベクトル</span>
      <span><i style="background:#e74c3c"></i>X成分</span>
      <span><i style="background:#3498db"></i>Y成分</span>
    </div>

    <div class="info" id="info"></div>
    <div class="row" id="balls"></div>

    <div class="row">
      <label>発射角度 θ
        <input id="sa" type="range" min="-180" max="180" step="1" value="60">
        <b id="av" style="min-width:3.5em"></b>
      </label>
    </div>

    <div class="row">
      <button class="go" id="fire">発射</button>
      <button id="stop">止める</button>
      <button id="fast">倍速 ×1</button>
      <button id="reset">最初から</button>
      <button class="go" id="next">次へ</button>
      <button id="regen">フィールドを更新</button>
    </div>

    <div class="help">
      【操作方法】①枠内の空きスペースをタップ → 発射位置を移動。②球を押したまま発射したい方向と反対側へ引っ張り、指を離すと発射します（引っ張る距離が長いほど初速度が大きく、最大10 m/s）。③角度スライダーや「発射」ボタンも利用可。緑が合成ベクトル、赤がX成分、青がY成分です。壁の線が太いほど反発係数が大きく、点線の床は「なし」（落ちると球が消える）です。進行はこの端末のブラウザに自動保存されます。
    </div>
  </main>

  <script>
    const g = 9.8, R = 1, ML = 38, MT = 10, MB = 30, MR = 10, FW = 557, CW = ML + FW + MR, CH = MT + FW + MB, DT = 1 / 480, V0 = 2.5 * g, VMAX = 300, E1 = .98;
    const BALLS = [
      { n: 'スーパー e.98·m', e: E1, M: 1, col: '#c0392b' },
      { n: '鉄球 e.75·2m', e: .75, M: 2, col: '#7f8c8d' },
      { n: 'ド○ゴンボール e.75·m', e: .75, M: 1, col: '#e67e22' }
    ];
    const TOAST = [
      '反発係数2のブロックが出現!',
      '球が真二つに分離!',
      '質量×2(60秒)',
      '重力×2(60秒)',
      '無重力(60秒)',
      'ドパガキモード突入(30秒)',
      '慣性系突入(60秒)'
    ];
    const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = CW * dpr;
    cv.height = CH * dpr;

    let N, W, H, S, wl, L = 1, seed = 1, blocks = [], balls = [], trail = [], shots = 0, lim = 2, lvT = 0, totT = 0, totS = 0, sumS = 0, sumL = 0, state = 'aim', ballType = 0, dUses = 0, aim = { x: 0, y: 0 }, mult = 1, stillT = 0, failStreak = 0, tilt = 0, lastAng = 60, fx = {}, toast = '', toastAt = 0, lastGrade = '-', cols, rows;

    // ドラッグ発射用の状態
    let dragging = false;
    let dragPoint = null;
    let pullDistance = 0;
    let launchSpeed = 0;

    // 引っ張り距離1mあたりの速度増加量（最大10 m/s）
    const MAX_LAUNCH_SPEED = 10;
    const SPEED_PER_DISTANCE = MAX_LAUNCH_SPEED / 2; // 2m引っ張りで最大速度
    const MAX_ARROW_LENGTH = 12 * g;

    const tx = x => ML + x * S;
    const ty = y => MT + (H - y) * S;
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

    function mulberry(a) {
      return () => {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const gradeOf = r => r <= .5 ? 'S' : r <= .6 ? 'A' : r <= .7 ? 'B' : r <= .8 ? 'C' : r <= .9 ? 'D' : r < 1 ? 'E' : 'F';

    function setup() {
      N = 6 + Math.floor((L - 1) / 2);
      W = H = N * g;
      S = FW / W;

      const r = mulberry(seed + L * 7919);
      const pick = a => a[Math.floor(r() * a.length)];
      const es = [E1, E1, .9, .75, .5, .25];

      wl = L === 1
        ? { l: E1, r: E1, c: E1, f: E1 }
        : { l: pick(es), r: pick(es), c: pick(es), f: (L >= 3 && r() < .2) ? 0 : pick(es) };

      tilt = (L >= 20 && r() < .5)
        ? (r() < .5 ? -1 : 1) * (5 + r() * 25) * Math.PI / 180
        : 0;

      cols = Math.floor(N / 2);
      rows = Math.min(2 + Math.floor(L / 4), N - 4);

      const cw = W / cols, cells = [];

      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++)cells.push([i, j]);
      }

      for (let k = cells.length - 1; k > 0; k--) {
        const m = Math.floor(r() * (k + 1));
        [cells[k], cells[m]] = [cells[m], cells[k]];
      }

      const cnt = Math.min(cells.length, Math.round(cols * rows * Math.max(.4, 1 - .03 * L)));

      blocks = cells.slice(0, cnt).map(([i, j]) => {
        const hat = L >= 2 && r() < .12;
        const e = hat ? E1 : (r() < .5 ? E1 : .5);
        return { x: i * cw, y: j * g, w: cw, h: g, i, j, e, hat, th: (e === E1 ? 16 : 8) * g, imp: 0, alive: true };
      });

      lim = 3 + Math.floor(L * .4);
      shots = 0;
      lvT = 0;
      balls = [];
      trail = [];
      fx = { mass: 0, grav: 0, zero: 0, dopa: 0, inert: 0, ix: 0 };

      aim = { x: W / 2, y: (rows + 2) * g };
      state = 'aim';
      stillT = 0;
      resetDrag();

      if (ballType === 2 && L < 43) ballType = 0;

      $('msg').textContent = '';
      $('next').style.display = 'none';
      $('regen').style.display = 'none';

      buildBalls();
      syncUI();
      saveGame();
    }

    function resetDrag() {
      dragging = false;
      dragPoint = null;
      pullDistance = 0;
      launchSpeed = 0;
    }

    function buildBalls() {
      const box = $('balls');
      box.innerHTML = '';

      BALLS.forEach((b, i) => {
        if (i === 2 && L < 43) return;

        const bt = document.createElement('button');
        bt.textContent = b.n;
        if (i === ballType) bt.className = 'on';

        bt.onclick = () => {
          if (state !== 'aim') return;
          ballType = i;
          buildBalls();
          syncUI();
          saveGame();
        };

        box.appendChild(bt);
      });
    }

    const gk = () => (fx.zero > 0 ? 0 : fx.grav > 0 ? 2 : 1);
    const mk = () => (fx.mass > 0 ? 2 : 1) * (fx.dopa > 0 ? 2 : 1);

    function insideBlock(x, y) {
      return blocks.some(b =>
        b.alive &&
        Math.hypot(
          x - Math.max(b.x, Math.min(x, b.x + b.w)),
          y - Math.max(b.y, Math.min(y, b.y + b.h))
        ) < R + .05
      );
    }

    function step(b, dt, commit, pend) {
      const sp = Math.hypot(b.vx, b.vy);

      if (sp > VMAX) {
        b.vx *= VMAX / sp;
        b.vy *= VMAX / sp;
      }

      const gg = g * gk();
      const ax = gg * (-Math.sin(tilt) + (fx.inert > 0 ? fx.ix : 0));
      const ay = -gg * Math.cos(tilt);

      b.x += b.vx * dt + .5 * ax * dt * dt;
      b.y += b.vy * dt + .5 * ay * dt * dt;
      b.vx += ax * dt;
      b.vy += ay * dt;

      const eb = fx.dopa > 0 ? 1.5 : b.e;

      if (b.x < R) {
        if (b.vx < 0) {
          const E = eb * wl.l;
          b.x = R + (R - b.x) * E;
          b.vx *= -E;
        } else b.x = R;
      }

      if (b.x > W - R) {
        if (b.vx > 0) {
          const E = eb * wl.r;
          b.x = W - R - (b.x - W + R) * E;
          b.vx *= -E;
        } else b.x = W - R;
      }

      if (b.y > H - R) {
        if (b.vy > 0) {
          const E = eb * wl.c;
          b.y = H - R - (b.y - H + R) * E;
          b.vy *= -E;
        } else b.y = H - R;
      }

      if (wl.f > 0 || fx.dopa > 0) {
        if (b.y < R) {
          if (b.vy < 0) {
            const E = wl.f > 0 ? eb * wl.f : 2;
            b.y = R + (R - b.y) * E;
            b.vy *= -E;
          } else b.y = R;
        }
      } else if (b.y < -5) b.lost = true;

      if (!isFinite(b.x + b.y + b.vx + b.vy)) {
        b.lost = true;
        return;
      }

      b.x = Math.min(W - R, Math.max(R, b.x));
      b.y = Math.min(H - R, b.y);
      if (wl.f > 0 || fx.dopa > 0) b.y = Math.max(R, b.y);

      for (const k of blocks) {
        if (
          !k.alive ||
          b.x < k.x - R || b.x > k.x + k.w + R ||
          b.y < k.y - R || b.y > k.y + k.h + R
        ) continue;

        const cx = Math.max(k.x, Math.min(b.x, k.x + k.w));
        const cy = Math.max(k.y, Math.min(b.y, k.y + k.h));
        const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;

        if (d2 >= R * R) continue;

        let nx, ny, pen = 0;

        if (d2 < 1e-9) {
          const l = b.x - k.x;
          const r = k.x + k.w - b.x;
          const bt = b.y - k.y;
          const tp = k.y + k.h - b.y;
          const m = Math.min(l, r, bt, tp);

          if (m === l) { nx = -1; ny = 0; b.x = k.x - R; }
          else if (m === r) { nx = 1; ny = 0; b.x = k.x + k.w + R; }
          else if (m === bt) { nx = 0; ny = -1; b.y = k.y - R; }
          else { nx = 0; ny = 1; b.y = k.y + k.h + R; }
        } else {
          const d = Math.sqrt(d2);
          nx = dx / d;
          ny = dy / d;
          pen = R - d;
          b.x = cx + nx * R;
          b.y = cy + ny * R;
        }

        const vn = -(b.vx * nx + b.vy * ny);

        if (vn > 0) {
          const E = eb * k.e;
          const j = (1 + E) * vn;

          if (pen > 0) {
            b.x += nx * pen * E;
            b.y += ny * pen * E;
          }

          b.vx += j * nx;
          b.vy += j * ny;

          if (commit && j > .05) {
            k.imp += b.M * mk() * j;
            if (k.imp >= k.th) {
              k.alive = false;
              if (k.hat) pend.push([b, k]);
            }
          }
        }
      }
    }

    function collideBalls() {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const a = balls[i], b = balls[j];
          const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;

          if (d2 >= 4 * R * R || d2 < 1e-12) continue;

          const d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d;
          const vr = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;

          if (vr <= 0) continue;

          const jj = 2 * vr / (1 / a.M + 1 / b.M);

          a.vx -= jj / a.M * nx;
          a.vy -= jj / a.M * ny;
          b.vx += jj / b.M * nx;
          b.vy += jj / b.M * ny;

          const ov = (2 * R - d) / 2;
          a.x -= nx * ov;
          a.y -= ny * ov;
          b.x += nx * ov;
          b.y += ny * ov;
        }
      }
    }

    function startDopa() {
      if (fx.dopa <= 0) {
        for (const b of balls) {
          b.vx *= 2;
          b.vy *= 2;
        }
      }
      fx.dopa = 30;
    }

    function tickFx(dt) {
      for (const k of ['mass', 'grav', 'zero', 'inert']) {
        if (fx[k] > 0) fx[k] = Math.max(0, fx[k] - dt);
      }

      if (fx.dopa > 0) {
        fx.dopa -= dt;
        if (fx.dopa <= 0) {
          fx.dopa = 0;
          for (const b of balls) {
            b.vx /= 2;
            b.vy /= 2;
          }
        }
      }
    }

    function hatena(b) {
      const r = Math.floor(Math.random() * 7);
      toast = TOAST[r];
      toastAt = performance.now();

      if (r === 0) {
        const cw = W / cols, free = [];

        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows + 3; j++) {
            if (blocks.some(k => k.alive && k.i === i && k.j === j)) continue;

            const x = i * cw, y = j * g;

            if (balls.some(o =>
              Math.hypot(
                o.x - Math.max(x, Math.min(o.x, x + cw)),
                o.y - Math.max(y, Math.min(o.y, y + g))
              ) < R + .5
            )) continue;

            free.push([i, j]);
          }
        }

        if (free.length) {
          const [i, j] = free[Math.floor(Math.random() * free.length)];
          blocks.push({
            x: i * cw, y: j * g, w: cw, h: g, i, j,
            e: 2, hat: false, th: 16 * g, imp: 0, alive: true
          });
        }
      } else if (r === 1) {
        const ux = -b.vy * .4, uy = b.vx * .4, b2 = { ...b };
        b.M /= 2;
        b2.M = b.M;
        b.vx += ux;
        b.vy += uy;
        b2.vx -= ux;
        b2.vy -= uy;
        balls.push(b2);
      } else if (r === 2) fx.mass = 60;
      else if (r === 3) fx.grav = 60;
      else if (r === 4) fx.zero = 60;
      else if (r === 5) startDopa();
      else {
        fx.inert = 60;
        fx.ix = Math.random() < .5 ? -1 : 1;
      }
    }

    function launchAngle() {
      return +$('sa').value * Math.PI / 180;
    }

    // 指の位置から発射方向・速度を計算する
    function updateDrag(p) {
      dragPoint = p;

      // 指の位置から球へ向かうベクトル。
      // モンストと同様、引っ張った方向と反対向きに飛ぶ。
      const dx = aim.x - p.x;
      const dy = aim.y - p.y;

      pullDistance = Math.hypot(dx, dy);

      if (pullDistance > 0.01) {
        setAng(Math.atan2(dy, dx) * 180 / Math.PI);
      }

      launchSpeed = Math.min(
        MAX_LAUNCH_SPEED,
        pullDistance * SPEED_PER_DISTANCE
      );

      syncUI();
    }

    // 画面上に矢印と矢印の先端を描く
    function drawArrow(x1, y1, x2, y2, color, width = 2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);

      if (len < 1) return;

      const head = Math.min(10, Math.max(4, len * .18));
      const angle = Math.atan2(dy, dx);

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - head * Math.cos(angle - Math.PI / 6),
        y2 - head * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - head * Math.cos(angle + Math.PI / 6),
        y2 - head * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    function fire() {
      if (state !== 'aim' || insideBlock(aim.x, aim.y)) return;

      const T = BALLS[ballType];
      const a = launchAngle();

      // ドラッグ操作なら引っ張り距離から速度を決定。
      // 発射ボタンを直接押した場合は従来の初速度を使う。
      const speed = launchSpeed > .5 ? launchSpeed : V0;

      shots++;
      totS++;
      trail = [];
      stillT = 0;
      fx = { mass: 0, grav: 0, zero: 0, dopa: 0, inert: 0, ix: 0 };

      balls = [{
        x: aim.x,
        y: aim.y,
        vx: speed * Math.cos(a),
        vy: speed * Math.sin(a),
        e: T.e,
        M: T.M,
        col: T.col
      }];

      state = 'fly';
      $('msg').textContent = '';

      if (ballType === 2) {
        dUses++;
        if (dUses >= 7) {
          dUses = 0;
          startDopa();
          toast = TOAST[5];
          toastAt = performance.now();
        }
      }

      resetDrag();
      saveGame();
      syncUI();
    }

    function endShot(why) {
      balls = [];
      fx = { mass: 0, grav: 0, zero: 0, dopa: 0, inert: 0, ix: 0 };
      acc = 0;
      resetDrag();

      const cleared = blocks.every(k => !k.alive);

      if (cleared) finish(true);
      else if (shots >= lim) finish(false);
      else {
        state = 'aim';
        $('msg').textContent = {
          lost: '球が落ちました',
          still: '球が止まりました'
        }[why] || '';
        saveGame();
      }

      syncUI();
    }

    function finish(ok) {
      sumS += shots;
      sumL += lim;
      failStreak = ok ? 0 : failStreak + 1;
      lastGrade = ok ? gradeOf(shots / lim) : 'F';

      const cum = gradeOf(sumS / sumL);

      if (ok) {
        state = L >= 99 ? 'all' : 'clear';
        $('msg').textContent =
          (L >= 99 ? 'ALL CLEAR! ' : '') +
          'Lv' + L + 'クリア! ' + shots + '/' + lim + '手 ' +
          lvT.toFixed(1) + '秒 スコア' + lastGrade + ' / 通算' + cum;
        $('next').textContent = L >= 99 ? '最初から' : '次のレベルへ';
      } else {
        state = 'fail';
        $('msg').textContent =
          '手数切れ… Lv' + L + 'をやり直し (スコアF / 通算' + cum + ')';
        $('next').textContent = 'やり直す';
      }

      $('next').style.display = 'inline-block';
      $('regen').style.display = failStreak >= 5 ? 'inline-block' : 'none';
      saveGame();
    }

    let last = performance.now(), acc = 0, tr = 0;

    function loop(now) {
      const dt = Math.min(.05, (now - last) / 1000);
      last = now;

      if (state === 'fly') {
        acc += dt * mult;

        while (acc >= DT && state === 'fly') {
          const pend = [];

          for (const b of balls) step(b, DT, true, pend);
          collideBalls();

          for (const [b] of pend) hatena(b);

          balls = balls.filter(b => !b.lost);
          tickFx(DT);
          lvT += DT;
          totT += DT;
          acc -= DT;
          tr += DT;

          if (tr > .03) {
            tr = 0;
            for (const b of balls) trail.push([b.x, b.y, b.col]);
            if (trail.length > 240) trail.splice(0, trail.length - 240);
          }

          if (blocks.every(k => !k.alive)) {
            endShot('clear');
            break;
          }

          if (!balls.length) {
            endShot('lost');
            break;
          }
        }

        syncUI();
      }

      draw();
      requestAnimationFrame(loop);
    }

    // ドラッグ中は、設定された初速度を使って予測軌道を描く
    function preview() {
      const T = BALLS[ballType];
      const a = launchAngle();
      const speed = dragging && launchSpeed > .5 ? launchSpeed : V0;

      const b = {
        x: aim.x,
        y: aim.y,
        vx: speed * Math.cos(a),
        vy: speed * Math.sin(a),
        e: T.e,
        M: T.M
      };

      const pts = [];

      for (let i = 0; i < 900 && !b.lost; i++) {
        step(b, DT * 2, false, []);
        if (i % 12 === 0) pts.push([b.x, b.y]);
      }

      return pts;
    }

    function draw() {
      const tt0 = performance.now() / 1000;
      const sh = fx.dopa > 0
        ? Math.pow(Math.max(0, Math.sin(tt0 * .9)), 3) * Math.sin(tt0 * 45) * 10
        : 0;

      ctx.setTransform(dpr, 0, 0, dpr, sh * dpr, 0);

      const paper = css('--paper');
      const ink = css('--ink');
      const grid = css('--grid');
      const accColor = css('--acc');

      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, CW, CH);

      ctx.save();

      {
        const cx = ML + FW / 2, cy = MT + FW / 2;
        const k = 1 / (Math.abs(Math.cos(tilt)) + Math.abs(Math.sin(tilt)));
        ctx.translate(cx, cy);
        ctx.rotate(-tilt);
        ctx.scale(k, k);
        ctx.translate(-cx, -cy);
      }

      ctx.font = '12px "Zen Kurenaido",sans-serif';
      ctx.textBaseline = 'middle';

      const stp = Math.max(1, Math.ceil(N / 6));

      ctx.lineWidth = 1;
      ctx.strokeStyle = grid;

      for (let k = 0; k <= N; k += stp) {
        ctx.beginPath();
        ctx.moveTo(tx(k * g), ty(0));
        ctx.lineTo(tx(k * g), ty(H));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(tx(0), ty(k * g));
        ctx.lineTo(tx(W), ty(k * g));
        ctx.stroke();
      }

      ctx.fillStyle = ink;

      for (let k = stp; k <= N; k += stp) {
        ctx.textAlign = 'right';
        ctx.fillText(k + 'g', ML - 4, ty(k * g));

        ctx.textAlign = 'center';
        ctx.fillText(k + 'g', tx(k * g), ty(0) + 13);
      }

      ctx.strokeStyle = ink;
      ctx.lineCap = 'butt';

      const seg = (x1, y1, x2, y2, e, dash) => {
        ctx.lineWidth = 1 + 3 * e;
        ctx.setLineDash(dash ? [6, 5] : []);
        ctx.beginPath();
        ctx.moveTo(tx(x1), ty(y1));
        ctx.lineTo(tx(x2), ty(y2));
        ctx.stroke();
        ctx.setLineDash([]);
      };

      seg(0, 0, 0, H, wl.l);
      seg(W, 0, W, H, wl.r);
      seg(0, H, W, H, wl.c);

      if (wl.f > 0) seg(0, 0, W, 0, wl.f);
      else if (fx.dopa > 0) seg(0, 0, W, 0, 2);
      else seg(0, 0, W, 0, .3, true);

      for (const b of blocks) {
        if (!b.alive) continue;

        const rem = Math.max(0, 1 - b.imp / b.th);
        const x = tx(b.x);
        const y = ty(b.y + b.h);
        const w = b.w * S;
        const h = b.h * S;

        if (w < 24) {
          ctx.globalAlpha = .3 + .7 * rem;
          ctx.fillStyle = b.e === 2 ? accColor : b.e === .5 ? grid : ink;
          ctx.fillRect(x, y, w, h);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = paper;
          ctx.lineWidth = .8;
          ctx.strokeRect(x, y, w, h);

          if (b.hat) {
            ctx.fillStyle = accColor;
            ctx.fillRect(x + w * .3, y + h * .3, w * .4, h * .4);
          }

          continue;
        }

        ctx.save();
        ctx.globalAlpha = .3 + .7 * rem;
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();

        const dark = b.e !== .5;
        const two = b.e === 2;

        ctx.fillStyle = two ? accColor : dark ? ink : paper;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = dark ? paper : ink;
        ctx.lineWidth = 1.2;

        const sp = Math.max(3, Math.min(dark ? 6 : 9, w / 5));

        ctx.beginPath();

        for (let k = -h; k < w + h; k += sp) {
          ctx.moveTo(x + k, y);
          ctx.lineTo(x + k + h, y + h);
        }

        if (dark) {
          for (let k = -h; k < w + h; k += sp) {
            ctx.moveTo(x + k + h, y);
            ctx.lineTo(x + k, y + h);
          }
        }

        ctx.stroke();
        ctx.restore();

        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);
        ctx.textAlign = 'center';

        if (b.hat || w >= 60) {
          const lab = b.hat ? '?' : 'e=' + b.e + ' 残' + Math.round(rem * 100) + '%';

          ctx.font = (b.hat
            ? 'bold ' + Math.max(10, Math.min(h * .8, 22))
            : '12') + 'px "Zen Kurenaido",sans-serif';

          const tw = ctx.measureText(lab).width + (b.hat ? 8 : 10);

          ctx.fillStyle = paper;
          ctx.fillRect(
            x + w / 2 - tw / 2,
            y + h / 2 - Math.min(9, h / 2),
            tw,
            Math.min(18, h)
          );

          ctx.fillStyle = b.hat ? accColor : ink;
          ctx.fillText(lab, x + w / 2, y + h / 2);
          ctx.font = '12px "Zen Kurenaido",sans-serif';
        }
      }

      // 予測軌道とモンスト風の矢印
      if (state === 'aim') {
        ctx.fillStyle = accColor;

        for (const p of preview()) {
          ctx.beginPath();
          ctx.arc(tx(p[0]), ty(p[1]), 1.6, 0, Math.PI * 2);
          ctx.fill();
        }

        const a = launchAngle();
        const ox = tx(aim.x);
        const oy = ty(aim.y);

        if (dragging && dragPoint && pullDistance > .1) {
          // 引っ張る距離に応じて矢印の長さを調整
          const arrowLen = Math.min(MAX_ARROW_LENGTH, pullDistance * 1.4);
          const dx = Math.cos(a) * arrowLen;
          const dy = Math.sin(a) * arrowLen;

          const ex = tx(aim.x + dx);
          const ey = ty(aim.y + dy);

          // X成分：横方向
          drawArrow(ox, oy, ex, oy, '#e74c3c', 3);

          // Y成分：縦方向
          drawArrow(ex, oy, ex, ey, '#3498db', 3);

          // 合成ベクトル：斜め方向
          drawArrow(ox, oy, ex, ey, '#27ae60', 4);

          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'left';

          // X成分ラベル
          ctx.fillStyle = '#e74c3c';
          ctx.fillText('Vx', (ox + ex) / 2, oy + 15);

          // Y成分ラベル
          ctx.fillStyle = '#3498db';
          ctx.fillText('Vy', ex + 5, (oy + ey) / 2);

          // 合成速度ラベル
          ctx.fillStyle = '#27ae60';
          ctx.fillText(
            'v=' + launchSpeed.toFixed(1) + '/' + MAX_LAUNCH_SPEED,
            ox + (ex - ox) * .45,
            oy + (ey - oy) * .45 - 8
          );

          // 角度と引っ張り距離
          ctx.fillStyle = ink;
          ctx.fillText(
            'θ=' + $('sa').value + '°',
            ox + 8,
            oy - 18
          );

          ctx.fillText(
            '引く距離 ' + pullDistance.toFixed(1),
            ox + 8,
            oy - 33
          );
        } else {
          // ドラッグしていないときは発射方向を表示
          const al = Math.max(5, 26 / S);

          drawArrow(
            ox,
            oy,
            tx(aim.x + al * Math.cos(a)),
            ty(aim.y + al * Math.sin(a)),
            accColor,
            2
          );
        }
      }

      ctx.globalAlpha = .45;

      for (const p of trail) {
        ctx.fillStyle = p[2];
        ctx.beginPath();
        ctx.arc(tx(p[0]), ty(p[1]), 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      const rr = Math.max(R * S, 4);
      const list = state === 'fly'
        ? balls
        : [{ x: aim.x, y: aim.y, col: BALLS[ballType].col }];

      for (const b of list) {
        ctx.fillStyle = b.col;
        ctx.beginPath();
        ctx.arc(tx(b.x), ty(b.y), rr, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.fillStyle = ink;
      ctx.textAlign = 'left';
      ctx.fillText('y[m]', 2, MT + 8);
      ctx.textAlign = 'right';
      ctx.fillText('x[m]', CW - 2, ty(0) + 13);

      ctx.restore();

      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CW - 22, 14);
      ctx.lineTo(CW - 22, 36);
      ctx.moveTo(CW - 27, 30);
      ctx.lineTo(CW - 22, 37);
      ctx.lineTo(CW - 17, 30);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText('g', CW - 30, 22);

      if (fx.dopa > 0) {
        const tt = performance.now() / 1000;
        const gr = ctx.createLinearGradient(0, 0, CW, CH);

        for (let i = 0; i <= 6; i++) {
          gr.addColorStop(i / 6, 'hsl(' + ((i * 60 + tt * 200) % 360) + ',100%,55%)');
        }

        ctx.globalAlpha = .3;
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, CW, CH);
        ctx.globalAlpha = 1;

        ctx.font = 'bold ' + (54 + 6 * Math.sin(tt * 14)) + 'px "Zen Kurenaido",sans-serif';
        ctx.textAlign = 'center';
        ctx.textJoin = 'round';
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#000';
        ctx.strokeText('ドパガキモード', CW / 2, CH * .2);
        ctx.fillStyle = gr;
        ctx.fillText('ドパガキモード', CW / 2, CH * .2);

        ctx.font = 'bold 22px "Zen Kurenaido",sans-serif';
        ctx.lineWidth = 4;

        const rt = '残り ' + fx.dopa.toFixed(1) + ' 秒';

        ctx.strokeText(rt, CW / 2, CH * .2 + 44);
        ctx.fillStyle = '#fff';
        ctx.fillText(rt, CW / 2, CH * .2 + 44);
      }

      cv.style.boxShadow = fx.dopa > 0
        ? '0 0 28px 8px hsl(' + ((performance.now() / 5) % 360) + ',100%,60%)'
        : 'none';
    }

    function syncUI() {
      $('av').textContent = $('sa').value + '°';

      const f = [];

      if (fx.mass > 0) f.push('質量×2 ' + fx.mass.toFixed(1) + 's');
      if (fx.grav > 0) f.push('重力×2 ' + fx.grav.toFixed(1) + 's');
      if (fx.zero > 0) f.push('無重力 ' + fx.zero.toFixed(1) + 's');
      if (fx.inert > 0) f.push('慣性系 ' + (fx.ix > 0 ? '→' : '←') + fx.inert.toFixed(1) + 's');
      if (fx.dopa > 0) f.push('ドパガキ ' + fx.dopa.toFixed(1) + 's');
      if (performance.now() - toastAt < 3500) f.unshift('★' + toast);

      $('fx').textContent = f.join('  ');

      const cum = sumL ? gradeOf(sumS / sumL) : '-';
      const w = x => x > 0 ? x : 'なし';

      $('info').innerHTML = [
        'Lv ' + L + (L >= 99 ? ' (最終)' : ''),
        '手数 ' + shots + ' / ' + lim,
        '今回 ' + lvT.toFixed(1) + ' 秒',
        '累積 ' + totS + '手 ' + totT.toFixed(0) + '秒',
        'スコア ' + lastGrade + ' / 通算 ' + cum,
        'ブロック残 ' + blocks.filter(k => k.alive).length,
        '壁e 左' + wl.l + ' 右' + wl.r + ' 天' + wl.c,
        '床e ' + w(wl.f),
        '発射位置 (' + aim.x.toFixed(1) + ', ' + aim.y.toFixed(1) + ')',
        '傾き ' + (tilt * 180 / Math.PI).toFixed(0) + '°'
      ].concat(L >= 43 ? ['ド○ゴンボール使用 ' + dUses + '/7'] : [])
        .map(s => '<span>' + s + '</span>').join('');

      $('fire').disabled = state !== 'aim' || insideBlock(aim.x, aim.y);
    }

    function toField(e) {
      const r = cv.getBoundingClientRect();
      const q = CW / r.width;
      const cx = ML + FW / 2, cy = MT + FW / 2;
      const kk = 1 / (Math.abs(Math.cos(tilt)) + Math.abs(Math.sin(tilt)));

      const dx = (e.clientX - r.left) * q - cx;
      const dy = (e.clientY - r.top) * q - cy;
      const c = Math.cos(tilt), s = Math.sin(tilt);
      const rx = (dx * c - dy * s) / kk + cx;
      const ry = (dx * s + dy * c) / kk + cy;

      return { x: (rx - ML) / S, y: H - (ry - MT) / S };
    }

    function setAng(v) {
      v = Math.round(v);

      if (v === 90 || v === -90) {
        v = v > 0
          ? (lastAng < 90 ? 91 : 89)
          : (lastAng > -90 ? -91 : -89);
      }

      lastAng = v;
      $('sa').value = v;
    }

    const KEY = 'mechBreakout.v1';

    function saveGame() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          L, seed, wl, tilt, cols, rows, blocks, shots, lvT, totT, totS, sumS, sumL,
          lastGrade, dUses, ballType, failStreak, aim, ang: +$('sa').value,
          state: state === 'fly' ? 'aim' : state,
          msg: $('msg').textContent
        }));
      } catch (e) { }
    }

    function loadGame() {
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || 'null');

        if (!d || !(d.L >= 1) || !d.blocks || !d.wl || !d.aim) return false;

        ({
          L, seed, wl, tilt, cols, rows, blocks, shots, lvT, totT, totS,
          sumS, sumL, lastGrade, dUses, ballType, failStreak, aim
        } = d);

        N = 6 + Math.floor((L - 1) / 2);
        W = H = N * g;
        S = FW / W;
        lim = 3 + Math.floor(L * .4);

        balls = [];
        trail = [];
        fx = { mass: 0, grav: 0, zero: 0, dopa: 0, inert: 0, ix: 0 };
        stillT = 0;
        state = d.state || 'aim';

        resetDrag();
        setAng(d.ang || 60);
        $('msg').textContent = d.msg || '';

        buildBalls();
        syncUI();

        $('next').style.display =
          (state === 'clear' || state === 'fail' || state === 'all')
            ? 'inline-block'
            : 'none';

        $('next').textContent = state === 'fail'
          ? 'やり直す'
          : state === 'all'
            ? '最初から'
            : '次のレベルへ';

        $('regen').style.display =
          (state === 'fail' && failStreak >= 5)
            ? 'inline-block'
            : 'none';

        return true;
      } catch (e) {
        return false;
      }
    }

    // モンスト風ドラッグ操作。
    // 球の近くを押してドラッグ → 離すと発射。
    // 球から離れた場所をタップ → ブロック外なら発射位置を移動。
    cv.addEventListener('pointerdown', e => {
      if (state !== 'aim') return;

      const p = toField(e);
      const distance = Math.hypot(p.x - aim.x, p.y - aim.y);

      if (distance <= 3.5 * R) {
        // 球の近く：ドラッグ発射モードへ
        dragging = true;
        dragPoint = p;
        pullDistance = 0;
        launchSpeed = 0;
        cv.setPointerCapture(e.pointerId);
        $('msg').textContent = '引っ張って、指を離すと発射';
        syncUI();
      } else {
        // 球から離れた場所：有効領域内なら発射位置を移動
        const inField =
          p.x >= R && p.x <= W - R &&
          p.y >= R && p.y <= H - R;
        if (inField && !insideBlock(p.x, p.y)) {
          aim = { x: p.x, y: p.y };
          $('msg').textContent = '発射位置を移動しました';
          syncUI();
          saveGame();
        } else {
          $('msg').textContent = 'ブロック外の場所を選んでください';
        }
      }
    });

    cv.addEventListener('pointermove', e => {
      if (!dragging || state !== 'aim') return;

      const p = toField(e);
      updateDrag(p);
    });

    function finishDrag() {
      if (!dragging) return;

      const shouldFire = pullDistance > .5;

      if (shouldFire) {
        // fire()内で速度を読み取ってからドラッグ状態を解除する
        fire();
      } else {
        resetDrag();
        $('msg').textContent = 'もう少し引っ張ってください';
        syncUI();
        saveGame();
      }
    }

    function cancelDrag() {
      if (!dragging) return;
      resetDrag();
      syncUI();
    }

    cv.addEventListener('pointerup', finishDrag);
    cv.addEventListener('pointercancel', cancelDrag);

    $('sa').oninput = () => {
      // ドラッグ中はドラッグ方向を優先
      if (!dragging) setAng(+$('sa').value);
      syncUI();
      saveGame();
    };

    $('fire').onclick = () => {
      if (state !== 'aim') return;
      resetDrag();
      fire();
    };

    $('stop').onclick = () => {
      if (state === 'fly') endShot('');
    };

    $('fast').onclick = () => {
      mult = mult === 1 ? 3 : mult === 3 ? 10 : 1;
      $('fast').textContent = '倍速 ×' + mult;
    };

    function fullReset() {
      failStreak = 0;
      L = 1;
      seed = Math.floor(Math.random() * 1e6);
      totT = 0;
      totS = 0;
      sumS = 0;
      sumL = 0;
      lastGrade = '-';
      dUses = 0;
      ballType = 0;
      setup();
    }

    let rc = 0;

    $('reset').onclick = () => {
      if (rc) {
        clearTimeout(rc);
        rc = 0;
        $('reset').textContent = '最初から';
        fullReset();
        return;
      }

      $('reset').textContent = '本当に初期化?もう一度タップ';

      rc = setTimeout(() => {
        rc = 0;
        $('reset').textContent = '最初から';
      }, 4000);
    };

    $('regen').onclick = () => {
      failStreak = 0;
      seed = Math.floor(Math.random() * 1e6);
      setup();
    };

    $('next').onclick = () => {
      if (state === 'clear') {
        L++;
        seed = Math.floor(Math.random() * 1e6);
        setup();
      } else if (state === 'fail') {
        setup();
      } else if (state === 'all') {
        fullReset();
      }
    };

    if (!loadGame()) fullReset();

    requestAnimationFrame(loop);
  </script>
</body>

</html>
